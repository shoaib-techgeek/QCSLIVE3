openapi: 3.1.0
info:
  title: QCS Store API
  version: 1.0.0
  description: |
    Headless JSON API (ADR-0003). Contract first: update this file before changing a route.
    Browsers authenticate with the HttpOnly `sid` cookie. Every mutating request must send
    `X-Requested-With: XMLHttpRequest` (CSRF guard).
servers:
  - url: http://localhost:4000
paths:
  /health/live:
    get:
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /health/ready:
    get:
      summary: Readiness (database reachable)
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Database down, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /api/v1/auth/register:
    post:
      summary: Create an account
      description: With email verification on, always 202 (no account enumeration). Off, 201 and the account is active; a duplicate email is 409.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Register' } } } }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResult' } } } }
        '202': { description: Verification email sent if registrable, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/verify-email:
    post:
      summary: Confirm email with a single-use token (24 h)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenBody' } } } }
      responses:
        '204': { description: Verified }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/login:
    post:
      summary: Sign in; sets the `sid` cookie (7-day server-side session)
      description: Five failed attempts lock the account for 15 minutes.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204': { description: Signed out }
  /api/v1/auth/forgot-password:
    post:
      summary: Request a reset link (always 202; token valid 1 h, newest wins)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPassword' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/reset-password:
    post:
      summary: Set a new password with a single-use token; signs out all devices
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPassword' } } } }
      responses:
        '204': { description: Password reset }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/change-password:
    post:
      summary: Change password; signs out other devices
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePassword' } } } }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      summary: Current account (permission account:read)
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update profile (permission account:update)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfile' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/seller/profile:
    post:
      summary: Create your store (one store per user)
      description: Status starts as `pending` and KYC as `not_submitted`. Store name 3-60 chars; the slug is derived from it and is permanent.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSeller' } } } }
      responses:
        '201': { description: Store created, content: { application/json: { schema: { $ref: '#/components/schemas/SellerEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { description: SELLER_EXISTS or STORE_NAME_TAKEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      summary: Your store (404 SELLER_NOT_FOUND if none)
      responses:
        '200': { description: Store, content: { application/json: { schema: { $ref: '#/components/schemas/SellerEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update your store description (name, status and KYC status cannot be changed here)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSeller' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SellerEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc:
    get:
      summary: Your verification status, uploaded documents and masked details
      responses:
        '200': { description: KYC, content: { application/json: { schema: { $ref: '#/components/schemas/KycEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc/documents:
    post:
      summary: Upload a verification document (JPG, PNG or PDF, max 5 MB)
      description: |
        multipart/form-data. Send the `kind` field **before** the `file` part. File type is detected from content, not from the
        name. Single-file kinds replace the previous upload; `business_photo` allows up to 4. Only allowed while the application is
        `not_submitted` or `more_info_required` (otherwise 409 KYC_LOCKED).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [cnic_front, cnic_back, business_registration, business_photo, tax_certificate] }
                file: { type: string, format: binary }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { type: object, properties: { document: { $ref: '#/components/schemas/KycDocument' } } } } } }
        '400': { description: VALIDATION_ERROR, FILE_TYPE_NOT_ALLOWED or TOO_MANY_FILES, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '413': { description: FILE_TOO_LARGE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/seller/kyc/documents/{documentId}:
    delete:
      summary: Remove one of your uploaded documents (404 for anyone else's)
      parameters: [{ name: documentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc/pii:
    put:
      summary: Save CNIC, business address and optional tax number (encrypted at rest)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KycPii' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/KycEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc/submit:
    post:
      summary: Submit the application for review
      description: Needs cnic_front, cnic_back, business_registration, at least one business_photo and the details. Otherwise 400 KYC_INCOMPLETE listing what is missing.
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/KycEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc:
    get:
      summary: Review queue (permission kyc:review). Default shows submitted and under_review
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/KycQueue' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc/{sellerId}:
    get:
      summary: Full application incl. decrypted details (audited as kyc.pii_viewed)
      parameters: [{ name: sellerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Detail, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc/{sellerId}/documents/{documentId}:
    get:
      summary: Download a document (audited as kyc.document_viewed; never cached)
      parameters:
        - { name: sellerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: File bytes, content: { image/png: {}, image/jpeg: {}, application/pdf: {} } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc/{sellerId}/decision:
    post:
      summary: Decide on an application
      description: |
        start_review (submitted -> under_review), then approve, approve_with_conditions, reject or request_info.
        A note is required for everything except start_review and approve. Approval activates the store and grants the seller role.
        Invalid moves are 409 KYC_INVALID_TRANSITION.
      parameters: [{ name: sellerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KycDecision' } } } }
      responses:
        '200': { description: Decided, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: sid }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Health: { type: object, properties: { status: { type: string }, checks: { type: object } } }
    Message: { type: object, properties: { message: { type: string } } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            requestId: { type: string }
            details: { type: array, items: { type: object } }
    Register:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string }
        fullName: { type: string, minLength: 1, maxLength: 120 }
    RegisterResult:
      type: object
      properties: { verificationRequired: { type: boolean }, message: { type: string } }
    TokenBody: { type: object, required: [token], properties: { token: { type: string, minLength: 20, maxLength: 200 } } }
    Login: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, maxLength: 128 } } }
    ForgotPassword: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    ResetPassword: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } }
    ChangePassword: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string } } }
    UpdateProfile:
      type: object
      additionalProperties: false
      properties:
        fullName: { type: [string, 'null'], maxLength: 120 }
        phone: { type: [string, 'null'], description: 7-20 chars; digits, space, ( ) - and leading + }
    AccountEnvelope: { type: object, properties: { account: { $ref: '#/components/schemas/Account' } } }
    Account:
      type: object
      description: Shape is defined by AuthService.accountView; keep in sync.
      properties:
        id: { type: [string, integer] }
        email: { type: string }
        fullName: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        permissions: { type: array, items: { type: string } }
    CreateSeller:
      type: object
      additionalProperties: false
      required: [storeName]
      properties:
        storeName: { type: string, minLength: 3, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
    UpdateSeller:
      type: object
      additionalProperties: false
      required: [description]
      properties: { description: { type: [string, 'null'], maxLength: 1000 } }
    SellerEnvelope: { type: object, properties: { seller: { $ref: '#/components/schemas/Seller' } } }
    Seller:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeName: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [pending, active, suspended, closed] }
        kycStatus: { type: string, enum: [not_submitted, submitted, under_review, approved, approved_with_conditions, rejected, more_info_required] }
        createdAt: { type: string, format: date-time }
    KycDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        mime: { type: string }
        sizeBytes: { type: integer }
    KycEnvelope:
      type: object
      properties:
        kyc:
          type: object
          properties:
            status: { type: string }
            note: { type: [string, 'null'] }
            documents: { type: array, items: { $ref: '#/components/schemas/KycDocument' } }
            pii: { type: [object, 'null'], properties: { cnicLast4: { type: string }, hasAddress: { type: boolean }, hasNtn: { type: boolean } } }
            requiredDocuments: { type: array, items: { type: string } }
    KycPii:
      type: object
      additionalProperties: false
      required: [cnic, address]
      properties:
        cnic: { type: string, description: 13 digits, dashes optional }
        address: { type: string, minLength: 10, maxLength: 300 }
        ntn: { type: string, description: Optional; reviewers see a flag when missing }
    KycDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [start_review, approve, approve_with_conditions, reject, request_info] }
        note: { type: string, maxLength: 1000 }
    KycQueue:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              storeName: { type: string }
              status: { type: string }
              submittedAt: { type: [string, 'null'], format: date-time }
              flags: { type: array, items: { type: string } }
        nextCursor: { type: [integer, 'null'] }
