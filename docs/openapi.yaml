openapi: 3.1.0
info:
  title: QCS Store API
  version: 1.0.0
  description: |
    Headless JSON API (ADR-0003). Contract first: update this file before changing a route.
    Browsers authenticate with the HttpOnly `sid` cookie. Every mutating request must send
    `X-Requested-With: XMLHttpRequest` (CSRF guard).
servers:
  - url: http://localhost:4000
paths:
  /health/live:
    get:
      summary: Liveness
      security: []
      responses:
        '200': { description: Process is up, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /health/ready:
    get:
      summary: Readiness (database reachable)
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Database down, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /api/v1/auth/register:
    post:
      summary: Create an account
      description: With email verification on, always 202 (no account enumeration). Off, 201 and the account is active; a duplicate email is 409.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Register' } } } }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResult' } } } }
        '202': { description: Verification email sent if registrable, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/verify-email:
    post:
      summary: Confirm email with a single-use token (24 h)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenBody' } } } }
      responses:
        '204': { description: Verified }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/login:
    post:
      summary: Sign in; sets the `sid` cookie (7-day server-side session)
      description: Five failed attempts lock the account for 15 minutes.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204': { description: Signed out }
  /api/v1/auth/forgot-password:
    post:
      summary: Request a reset link (always 202; token valid 1 h, newest wins)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPassword' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/reset-password:
    post:
      summary: Set a new password with a single-use token; signs out all devices
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPassword' } } } }
      responses:
        '204': { description: Password reset }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/change-password:
    post:
      summary: Change password; signs out other devices
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePassword' } } } }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      summary: Current account (permission account:read)
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update profile (permission account:update)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfile' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/seller/profile:
    post:
      summary: Create your store (one store per user)
      description: Status starts as `pending` and KYC as `not_submitted`. Store name 3-60 chars; the slug is derived from it and is permanent.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSeller' } } } }
      responses:
        '201': { description: Store created, content: { application/json: { schema: { $ref: '#/components/schemas/SellerEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { description: SELLER_EXISTS or STORE_NAME_TAKEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      summary: Your store (404 SELLER_NOT_FOUND if none)
      responses:
        '200': { description: Store, content: { application/json: { schema: { $ref: '#/components/schemas/SellerEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update your store description (name, status and KYC status cannot be changed here)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSeller' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SellerEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc:
    get:
      summary: Your verification status, uploaded documents and masked details
      responses:
        '200': { description: KYC, content: { application/json: { schema: { $ref: '#/components/schemas/KycEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc/documents:
    post:
      summary: Upload a verification document (JPG, PNG or PDF, max 5 MB)
      description: |
        multipart/form-data. Send the `kind` field **before** the `file` part. File type is detected from content, not from the
        name. Single-file kinds replace the previous upload; `business_photo` allows up to 4. Only allowed while the application is
        `not_submitted` or `more_info_required` (otherwise 409 KYC_LOCKED).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [cnic_front, cnic_back, business_registration, business_photo, tax_certificate] }
                file: { type: string, format: binary }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { type: object, properties: { document: { $ref: '#/components/schemas/KycDocument' } } } } } }
        '400': { description: VALIDATION_ERROR, FILE_TYPE_NOT_ALLOWED or TOO_MANY_FILES, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '413': { description: FILE_TOO_LARGE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/seller/kyc/documents/{documentId}:
    delete:
      summary: Remove one of your uploaded documents (404 for anyone else's)
      parameters: [{ name: documentId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc/pii:
    put:
      summary: Save CNIC, business address and optional tax number (encrypted at rest)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KycPii' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/KycEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/kyc/submit:
    post:
      summary: Submit the application for review
      description: Needs cnic_front, cnic_back, business_registration, at least one business_photo and the details. Otherwise 400 KYC_INCOMPLETE listing what is missing.
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/KycEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc:
    get:
      summary: Review queue (permission kyc:review). Default shows submitted and under_review
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/KycQueue' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc/{sellerId}:
    get:
      summary: Full application incl. decrypted details (audited as kyc.pii_viewed)
      parameters: [{ name: sellerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Detail, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc/{sellerId}/documents/{documentId}:
    get:
      summary: Download a document (audited as kyc.document_viewed; never cached)
      parameters:
        - { name: sellerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: File bytes, content: { image/png: {}, image/jpeg: {}, application/pdf: {} } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/kyc/{sellerId}/decision:
    post:
      summary: Decide on an application
      description: |
        start_review (submitted -> under_review), then approve, approve_with_conditions, reject or request_info.
        A note is required for everything except start_review and approve. Approval activates the store and grants the seller role.
        Invalid moves are 409 KYC_INVALID_TRANSITION.
      parameters: [{ name: sellerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KycDecision' } } } }
      responses:
        '200': { description: Decided, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/products:
    get:
      summary: Your products, newest first (deleted ones are hidden)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending, active, inactive, rejected, banned] } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a draft product with its options and one priced SKU per variant
      description: |
        Drafting is allowed before KYC approval. Prices are integer minor units in the platform currency; the client never sends a currency or status.
        `skus` must cover every combination of `options` exactly once (a product without options has one SKU with empty `options`).
        Errors: 400 VALIDATION_ERROR, 409 SKU_CODE_TAKEN, 404 SELLER_NOT_FOUND.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProduct' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/products/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One of your products (404 for anyone else's)
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Edit a product
      description: |
        title, description and category only while draft, rejected or inactive (otherwise 409 PRODUCT_LOCKED). SKU price and active changes are also allowed
        while active. A changed price writes price history and emits `price.changed`. Status, slug and seller cannot be set.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProduct' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a draft, rejected or inactive product (it is hidden, not erased)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/products/{productId}/submit:
    post:
      summary: Send a draft or rejected product for review
      description: Needs an approved seller (403 SELLER_NOT_APPROVED otherwise). Status becomes pending; emits product.submitted and product.status_changed.
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: PRODUCT_INVALID_TRANSITION, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/seller/products/{productId}/deactivate:
    post:
      summary: Hide an active product from the store
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/products/{productId}/activate:
    post:
      summary: Show an inactive product in the store again (approved sellers only)
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Activated, content: { application/json: { schema: { $ref: '#/components/schemas/ProductEnvelope' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/products/{productId}/images:
    post:
      summary: Upload a product image (JPG, PNG or WebP, max 5 MB, at most 8 per product)
      description: multipart/form-data. Send the optional `altText` field before the `file` part. Only while draft, rejected or inactive.
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                altText: { type: string, maxLength: 200 }
                file: { type: string, format: binary }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { type: object, properties: { image: { $ref: '#/components/schemas/ProductImage' } } } } } }
        '400': { description: FILE_TYPE_NOT_ALLOWED or TOO_MANY_FILES, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { description: FILE_TOO_LARGE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/seller/products/{productId}/images/{imageId}:
    delete:
      summary: Remove one of your product images
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/media/products/{imageId}:
    get:
      summary: A product image
      description: Public for active products (cacheable). Owners and product reviewers can preview images of products that are not live (private, not cached). Anything else is 404.
      security: []
      parameters: [{ name: imageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Image bytes, content: { image/png: {}, image/jpeg: {}, image/webp: {} } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/products:
    get:
      summary: Product review queue (permission product:moderate), oldest first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, active, inactive, rejected, banned], default: pending } }
        - { name: cursor, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/admin/products/{productId}:
    get:
      summary: Full product for review, with the store name and status history
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Product, content: { application/json: { schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/products/{productId}/moderate:
    post:
      summary: Decide on a product
      description: |
        approve (pending -> active), reject (pending -> rejected), ban (pending, active or inactive -> banned), deactivate (active -> inactive).
        A reason is required for everything except approve and is shown to the seller. A banned product stays banned.
        Invalid moves are 409 PRODUCT_INVALID_TRANSITION.
      parameters: [{ name: productId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModerateProduct' } } } }
      responses:
        '200': { description: Decided, content: { application/json: { schema: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/seller/skus/{skuId}/stock:
    put:
      summary: Set the units on hand for one of your SKUs
      description: |
        Sets the shelf count (not a delta). It cannot go below the units already reserved for open orders (409 BELOW_RESERVED).
        Every change is recorded in an append-only stock ledger with your account and the optional note.
        Another seller's SKU is 404.
      parameters: [{ name: skuId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetStock' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { stock: { $ref: '#/components/schemas/Stock' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/categories:
    get:
      summary: Active categories in display order
      security: []
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CategoryRef' } } } } } } }
  /api/v1/products:
    get:
      summary: Live products (search, filter, sort)
      description: |
        Only active products from active sellers with at least one active SKU. `q` searches title and description. Default order is newest first
        (relevance when `q` is set). `minPrice` and `maxPrice` compare against the lowest SKU price, in minor units. `nextCursor` is opaque: pass it back unchanged.
        Browsers always revalidate (a hidden product disappears on the next load); shared caches may keep a response for 60 seconds. Responses never include seller codes, stock numbers or internal ids.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, price_asc, price_desc] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PublicProductPage' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/products/{slug}:
    get:
      summary: One live product
      security: []
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Product, content: { application/json: { schema: { type: object, properties: { product: { $ref: '#/components/schemas/PublicProduct' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/stores/{slug}:
    get:
      summary: Public store page (active stores only)
      security: []
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Store, content: { application/json: { schema: { type: object, properties: { store: { $ref: '#/components/schemas/PublicStore' } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/cart:
    get:
      summary: Your cart, grouped by store and revalidated against the catalogue
      description: |
        Prices, availability and product status are recomputed on every read; nothing stored in the cart is trusted for money.
        `changes` lists what the buyer should notice: PRICE_CHANGED, UNAVAILABLE, OUT_OF_STOCK, QTY_EXCEEDS_STOCK.
        `summary` counts only selected items that can be bought right now. Never cached.
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/cart/items:
    post:
      summary: Add an item (adds to the quantity if it is already there)
      description: Errors - 404 when the item is not on sale, 409 QTY_LIMIT (per-item maximum) or OUT_OF_STOCK (not enough units).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddCartItem' } } } }
      responses:
        '201': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/cart/items/{itemId}:
    patch:
      summary: Change quantity or selection, or accept a new price
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCartItem' } } } }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Not in your cart, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove an item
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: sid }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Health: { type: object, properties: { status: { type: string }, checks: { type: object } } }
    Message: { type: object, properties: { message: { type: string } } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            requestId: { type: string }
            details: { type: array, items: { type: object } }
    Register:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string }
        fullName: { type: string, minLength: 1, maxLength: 120 }
    RegisterResult:
      type: object
      properties: { verificationRequired: { type: boolean }, message: { type: string } }
    TokenBody: { type: object, required: [token], properties: { token: { type: string, minLength: 20, maxLength: 200 } } }
    Login: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, maxLength: 128 } } }
    ForgotPassword: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    ResetPassword: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } }
    ChangePassword: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string } } }
    UpdateProfile:
      type: object
      additionalProperties: false
      properties:
        fullName: { type: [string, 'null'], maxLength: 120 }
        phone: { type: [string, 'null'], description: 7-20 chars; digits, space, ( ) - and leading + }
    AccountEnvelope: { type: object, properties: { account: { $ref: '#/components/schemas/Account' } } }
    Account:
      type: object
      description: Shape is defined by AuthService.accountView; keep in sync.
      properties:
        id: { type: [string, integer] }
        email: { type: string }
        fullName: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        permissions: { type: array, items: { type: string } }
    CreateSeller:
      type: object
      additionalProperties: false
      required: [storeName]
      properties:
        storeName: { type: string, minLength: 3, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
    UpdateSeller:
      type: object
      additionalProperties: false
      required: [description]
      properties: { description: { type: [string, 'null'], maxLength: 1000 } }
    SellerEnvelope: { type: object, properties: { seller: { $ref: '#/components/schemas/Seller' } } }
    Seller:
      type: object
      properties:
        id: { type: string, format: uuid }
        storeName: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [pending, active, suspended, closed] }
        kycStatus: { type: string, enum: [not_submitted, submitted, under_review, approved, approved_with_conditions, rejected, more_info_required] }
        createdAt: { type: string, format: date-time }
    KycDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        mime: { type: string }
        sizeBytes: { type: integer }
    KycEnvelope:
      type: object
      properties:
        kyc:
          type: object
          properties:
            status: { type: string }
            note: { type: [string, 'null'] }
            documents: { type: array, items: { $ref: '#/components/schemas/KycDocument' } }
            pii: { type: [object, 'null'], properties: { cnicLast4: { type: string }, hasAddress: { type: boolean }, hasNtn: { type: boolean } } }
            requiredDocuments: { type: array, items: { type: string } }
    KycPii:
      type: object
      additionalProperties: false
      required: [cnic, address]
      properties:
        cnic: { type: string, description: 13 digits, dashes optional }
        address: { type: string, minLength: 10, maxLength: 300 }
        ntn: { type: string, description: Optional; reviewers see a flag when missing }
    KycDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [start_review, approve, approve_with_conditions, reject, request_info] }
        note: { type: string, maxLength: 1000 }
    KycQueue:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              storeName: { type: string }
              status: { type: string }
              submittedAt: { type: [string, 'null'], format: date-time }
              flags: { type: array, items: { type: string } }
        nextCursor: { type: [integer, 'null'] }
    ProductImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        altText: { type: [string, 'null'] }
        position: { type: integer }
    ProductOption:
      type: object
      required: [name, values]
      properties:
        name: { type: string, maxLength: 60 }
        values: { type: array, items: { type: string, maxLength: 60 } }
    CreateProduct:
      type: object
      additionalProperties: false
      required: [title, categorySlug, skus]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000, description: Plain text only }
        categorySlug: { type: string }
        options: { type: array, items: { $ref: '#/components/schemas/ProductOption' } }
        skus:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [sellerSku, priceMinor]
            properties:
              sellerSku: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
              options: { type: object, additionalProperties: { type: string } }
              priceMinor: { type: integer, minimum: 1, description: Minor units in the platform currency }
              compareAtMinor: { type: integer, description: Original price; must be higher than priceMinor }
    UpdateProduct:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        categorySlug: { type: string }
        skus:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string, format: uuid }
              priceMinor: { type: integer, minimum: 1 }
              compareAtMinor: { type: [integer, 'null'] }
              active: { type: boolean }
    Sku:
      type: object
      properties:
        id: { type: string, format: uuid }
        sellerSku: { type: string }
        options: { type: object, additionalProperties: { type: string } }
        priceMinor: { type: integer }
        compareAtMinor: { type: [integer, 'null'] }
        currency: { type: string }
        active: { type: boolean }
        stock: { $ref: '#/components/schemas/Stock' }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [draft, pending, active, inactive, rejected, banned] }
        rejectionReason: { type: [string, 'null'] }
        category: { type: [object, 'null'], properties: { slug: { type: string }, name: { type: string } } }
        options: { type: array, items: { $ref: '#/components/schemas/ProductOption' } }
        skus: { type: array, items: { $ref: '#/components/schemas/Sku' } }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }
    ProductEnvelope: { type: object, properties: { product: { $ref: '#/components/schemas/Product' } } }
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              slug: { type: string }
              status: { type: string }
              priceFromMinor: { type: [integer, 'null'] }
              currency: { type: [string, 'null'] }
              imageUrl: { type: [string, 'null'] }
        nextCursor: { type: [integer, 'null'] }
    ModerateProduct:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject, ban, deactivate] }
        reason: { type: string, maxLength: 1000 }
    AdminProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string }
              storeName: { type: [string, 'null'] }
              submittedAt: { type: string, format: date-time }
              priceFromMinor: { type: [integer, 'null'] }
              currency: { type: [string, 'null'] }
              imageCount: { type: integer }
        nextCursor: { type: [integer, 'null'] }
    Stock:
      type: object
      properties:
        onHand: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0, description: Held for open orders }
        available: { type: integer, minimum: 0, description: onHand minus reserved }
    SetStock:
      type: object
      additionalProperties: false
      required: [onHand]
      properties:
        onHand: { type: integer, minimum: 0, maximum: 2147483647 }
        note: { type: string, maxLength: 200 }
    CategoryRef:
      type: object
      properties: { slug: { type: string }, name: { type: string } }
    PublicStore:
      type: object
      properties: { name: { type: string }, slug: { type: string }, description: { type: [string, 'null'] } }
    PublicProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              slug: { type: string }
              priceMinor: { type: integer, description: Lowest active SKU price }
              compareAtMinor: { type: [integer, 'null'] }
              currency: { type: string }
              imageUrl: { type: [string, 'null'] }
              category: { $ref: '#/components/schemas/CategoryRef' }
              storeName: { type: [string, 'null'] }
              inStock: { type: boolean }
        nextCursor: { type: [string, 'null'] }
    PublicProduct:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/CategoryRef' }
        store: { type: object, properties: { name: { type: [string, 'null'] } } }
        options: { type: array, items: { $ref: '#/components/schemas/ProductOption' } }
        skus:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              options: { type: object, additionalProperties: { type: string } }
              priceMinor: { type: integer }
              compareAtMinor: { type: [integer, 'null'] }
              currency: { type: string }
              inStock: { type: boolean }
        images:
          type: array
          items: { type: object, properties: { url: { type: string }, altText: { type: [string, 'null'] } } }
    AddCartItem:
      type: object
      additionalProperties: false
      required: [skuId, qty]
      properties:
        skuId: { type: string, format: uuid }
        qty: { type: integer, minimum: 1 }
    UpdateCartItem:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        qty: { type: integer, minimum: 1 }
        selected: { type: boolean }
        acceptPrice: { type: boolean, enum: [true], description: Take the current price as the one the buyer has seen }
    CartChange:
      type: object
      required: [code]
      properties:
        code: { type: string, enum: [PRICE_CHANGED, UNAVAILABLE, OUT_OF_STOCK, QTY_EXCEEDS_STOCK] }
        oldMinor: { type: integer }
        newMinor: { type: integer }
        available: { type: integer }
    Cart:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              storeName: { type: string }
              subtotalMinor: { type: integer, description: Selected items that can be bought now }
              items:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    selected: { type: boolean }
                    qty: { type: integer }
                    priceMinor: { type: integer, description: Current price, recomputed on read }
                    compareAtMinor: { type: [integer, 'null'] }
                    currency: { type: string }
                    lineTotalMinor: { type: integer }
                    available: { type: [integer, 'null'] }
                    product: { type: object, properties: { title: { type: string }, slug: { type: [string, 'null'] }, imageUrl: { type: [string, 'null'] } } }
                    sku: { type: object, properties: { id: { type: [string, 'null'] }, options: { type: object, additionalProperties: { type: string } } } }
                    changes: { type: array, items: { $ref: '#/components/schemas/CartChange' } }
        summary:
          type: object
          properties: { itemCount: { type: integer }, subtotalMinor: { type: integer }, currency: { type: string } }
        changes:
          type: array
          items: { allOf: [{ $ref: '#/components/schemas/CartChange' }, { type: object, properties: { itemId: { type: string } } }] }
